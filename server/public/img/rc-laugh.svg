<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Nevető mosómedve">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffd27a"/><stop offset="55%" stop-color="#eb9b2e"/><stop offset="100%" stop-color="#c9532b"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4a36"/><stop offset="100%" stop-color="#5e3022"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <!-- fülek -->
  <path d="M30 44 Q26 20 44 32 Z" fill="url(#fur)"/><path d="M34 42 Q33 28 42 34 Z" fill="#d79a86"/>
  <path d="M90 44 Q94 20 76 32 Z" fill="url(#fur)"/><path d="M86 42 Q87 28 78 34 Z" fill="#d79a86"/>
  <!-- fej, kissé hátradől a nevetéstől -->
  <g transform="rotate(6 60 64)">
    <ellipse cx="60" cy="62" rx="33" ry="31" fill="url(#fur)"/>
    <path d="M60 48 Q40 50 40 70 Q46 86 60 86 Q74 86 80 70 Q80 50 60 48 Z" fill="#efe3d6"/>
    <path d="M38 56 Q50 50 60 55 Q70 50 82 56 Q80 64 70 64 Q62 62 60 59 Q58 62 50 64 Q40 64 38 56 Z" fill="#2c1b14"/>
    <!-- behunyt, kacagó szemek (ívek) -->
    <path d="M44 60 Q50 54 56 60" fill="none" stroke="#1a120d" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M64 60 Q70 54 76 60" fill="none" stroke="#1a120d" stroke-width="2.8" stroke-linecap="round"/>
    <!-- orr -->
    <ellipse cx="60" cy="68" rx="4" ry="3" fill="#1a120d"/>
    <!-- tátott nevető száj + nyelv -->
    <path d="M48 74 Q60 92 72 74 Z" fill="#1a120d"/>
    <path d="M53 80 Q60 90 67 80 Z" fill="#e8657b"/>
    <!-- nevetés-könnycseppek -->
    <circle cx="36" cy="64" r="3.3" fill="#9fe0ff"/><circle cx="84" cy="64" r="3.3" fill="#9fe0ff"/>
  </g>
  <text x="22" y="30" font-size="16" fill="#fff" opacity=".92">😂</text>
</svg>
