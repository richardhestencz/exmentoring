<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Táncoló mosómedve">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffb27a"/><stop offset="55%" stop-color="#eb772e"/><stop offset="100%" stop-color="#b83553"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4a36"/><stop offset="100%" stop-color="#5e3022"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <!-- táncoló: a fej kissé megdöntve, fülek lendülnek, egy mozdulatkar fent -->
  <g transform="rotate(-8 60 66)">
    <!-- fülek -->
    <path d="M30 44 Q26 20 44 32 Z" fill="url(#fur)"/><path d="M34 42 Q33 28 42 34 Z" fill="#d79a86"/>
    <path d="M90 44 Q94 20 76 32 Z" fill="url(#fur)"/><path d="M86 42 Q87 28 78 34 Z" fill="#d79a86"/>
    <!-- fej -->
    <ellipse cx="60" cy="62" rx="33" ry="31" fill="url(#fur)"/>
    <!-- arc világos rész -->
    <path d="M60 48 Q40 50 40 70 Q46 86 60 86 Q74 86 80 70 Q80 50 60 48 Z" fill="#efe3d6"/>
    <!-- maszk -->
    <path d="M38 58 Q50 50 60 56 Q70 50 82 58 Q80 68 70 68 Q62 66 60 62 Q58 66 50 68 Q40 68 38 58 Z" fill="#2c1b14"/>
    <!-- szemek vidáman -->
    <circle cx="50" cy="60" r="4.2" fill="#fff"/><circle cx="51" cy="60" r="2.4" fill="#1a120d"/>
    <circle cx="70" cy="60" r="4.2" fill="#fff"/><circle cx="69" cy="60" r="2.4" fill="#1a120d"/>
    <!-- orr -->
    <ellipse cx="60" cy="70" rx="4" ry="3" fill="#1a120d"/>
    <!-- mosolygó száj -->
    <path d="M52 76 Q60 82 68 76" fill="none" stroke="#1a120d" stroke-width="2.4" stroke-linecap="round"/>
    <!-- lendülő kar + kéz (tánc) -->
    <path d="M86 70 Q100 56 98 44" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="98" cy="42" r="6" fill="url(#fur)"/>
  </g>
  <!-- zenejegyek -->
  <text x="20" y="30" font-size="16" fill="#fff" opacity=".9">♪</text>
  <text x="98" y="92" font-size="14" fill="#fff" opacity=".85">♫</text>
</svg>
