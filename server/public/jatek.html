<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop City</title>
<link rel="icon" type="image/png" href="/img/raccoon-64.png">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3f3f3;font-family:system-ui,-apple-system,sans-serif;user-select:none}
canvas{display:block}
/* a tisztás betöltője */
#sync{position:fixed;inset:0;z-index:5;pointer-events:none;display:grid;place-items:center;font-family:ui-monospace,Menlo,monospace;color:#5b5b5b;letter-spacing:.35em;text-align:center}
#sync[hidden]{display:none}
#sync b{display:block;font-size:clamp(18px,4vw,30px);font-weight:700;animation:glitch 1.6s steps(1) infinite}
#sync span{display:block;margin-top:10px;font-size:13px;letter-spacing:.25em}
#sync i{display:block;margin:14px auto 0;width:min(320px,70vw);height:2px;background:linear-gradient(90deg,transparent,#8a8a8a,transparent)}
@keyframes glitch{0%,100%{transform:none;opacity:1}12%{transform:translateX(3px) skewX(8deg);opacity:.7}14%{transform:none;opacity:1}61%{transform:translateX(-4px);opacity:.6}63%{transform:none;opacity:1}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 140px 40px rgba(200,0,0,.75)}
/* HUD: jobb felső sarok (fegyver, pénz, csillagok), bal alul a térkép és az életerő, mint a nagy városi játékokban */
.hud{display:none}
body.playing .hud{display:block}
#tr{position:fixed;right:22px;top:16px;z-index:3;text-align:right;color:#fff;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6)}
#weapon{display:flex;gap:10px;align-items:baseline;justify-content:flex-end;font-weight:800;font-size:15px}
#weapon b{font-family:'Pricedown','Impact',sans-serif;font-size:20px;letter-spacing:.04em}
#money{font-family:'Pricedown','Impact',sans-serif;font-size:34px;color:#7be37b;letter-spacing:.03em;margin-top:2px}
#stars{font-size:26px;letter-spacing:2px;margin-top:-2px}
#stars i{font-style:normal;color:rgba(255,255,255,.18)}
#stars i.on{color:#fff;animation:star 1s steps(2) infinite}
@keyframes star{50%{color:#4aa3ff}}
#bl{position:fixed;left:22px;bottom:20px;z-index:3;width:210px}
#radar{display:block;width:210px;height:150px;border-radius:10px;border:3px solid rgba(0,0,0,.6);background:#2c3e2a}
.bars{display:flex;gap:4px;margin-top:5px}
.bars div{height:9px;background:rgba(0,0,0,.55);border-radius:2px;overflow:hidden}
.bars div:first-child{flex:2}.bars div:last-child{flex:1}
#hpbar{height:100%;width:100%;background:#5fcf5f}#arbar{height:100%;width:0;background:#4aa3ff}
#reticle{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6);z-index:3;pointer-events:none}
#reticle.aim{width:22px;height:22px;margin:-11px 0 0 -11px;background:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#reticle[hidden],body:not(.playing) #reticle{display:none}
#prompt{position:fixed;left:24px;top:22px;z-index:3;max-width:340px;background:rgba(0,0,0,.78);color:#fff;font-size:15px;line-height:1.4;padding:12px 16px;border-radius:4px}
#prompt[hidden]{display:none}
kbd{display:inline-block;background:#fff;color:#111;border-radius:4px;padding:0 7px;margin-right:8px;font:inherit;font-weight:900}
#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);opacity:0;transition:.3s;z-index:6;background:rgba(0,0,0,.78);color:#fff;font-weight:600;padding:9px 16px;border-radius:4px;pointer-events:none;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#cj{position:fixed;inset:0;z-index:12;color:#f7e5bd;font:15px system-ui,sans-serif}#cj[hidden],#cj-menu[hidden]{display:none}#cj,#cj *{box-sizing:border-box}
/* Card-Jitsu: compact walk-in lobby, then a transparent duel HUD over the physical tatami. */
body.cj-playing .hud,body.cj-playing #prompt,body.cj-playing #reticle{display:none!important}
#cj button,#cj-menu button{font:800 13px system-ui,sans-serif;letter-spacing:.01em;border:1px solid #b88346;background:#2a1712;color:#f6e7c8;padding:9px 12px;cursor:pointer}
#cj button:hover,#cj button:focus-visible,#cj-menu button:focus-visible{outline:3px solid #8ed8ff;outline-offset:2px;background:#45271c}
#cj button:disabled{opacity:.42;cursor:not-allowed;outline:0}
#cj.cj-lobby{inset:auto 18px 18px auto;width:min(560px,calc(100vw - 36px));max-height:min(76vh,720px);padding:0;background:none;overflow:visible;pointer-events:none;color:#2b1710;font-family:system-ui,sans-serif}
.cj-room-panel{pointer-events:auto;overflow:auto;max-height:min(76vh,720px);background:linear-gradient(145deg,#ead7a9,#cda96d);border:7px double #4a2818;box-shadow:0 20px 70px #000a,0 0 0 2px #d59a45;padding:16px}
.cj-room-panel header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #5a321e;padding-bottom:10px}.cj-room-panel header span,.cj-duel-top span{font:700 10px ui-monospace,monospace;letter-spacing:.18em}.cj-room-panel h1{font:46px/1 Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:2px 0 0;color:#542615}.cj-room-status{font-size:12px;margin:10px 0;color:#563620}.cj-room-status>span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d4583d;margin-right:7px}.cj-room-status>span.online{background:#398a52}
.cj-mats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cj-mats article{position:relative;min-height:156px;padding:11px;background:#e8d6a8;border:2px solid #75502f;box-shadow:inset 0 0 0 3px #b9a970;display:flex;flex-direction:column}.cj-mats article.active{box-shadow:inset 0 0 0 3px #ba552e}.cj-mats article>span{position:absolute;right:8px;top:5px;font:28px serif;color:#704226;opacity:.55}.cj-mats h2{font:21px Impact,sans-serif;margin:0;text-transform:uppercase}.cj-mats p{font-size:11px;line-height:1.45;min-height:45px;margin:7px 0;flex:1}.cj-mats button{font-size:11px;padding:7px}.cj-mats button small{display:block;font-weight:500}.cj-master-link{width:100%;margin-top:10px;text-align:left}.cj-master{position:relative;margin-top:10px;background:#f4e8c8;border-left:6px solid #7e4026;padding:14px 42px 14px 14px;font-size:13px;line-height:1.45}.cj-master h2{font:27px Impact,sans-serif;margin:0 0 5px}.cj-master p{margin:7px 0}.cj-master .cj-close{position:absolute;right:7px;top:7px;padding:4px 9px}.cj-bots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:11px 0}.cj-bots button{display:flex;flex-direction:column}.cj-bots small{font-weight:400;color:#d9c6a4}.cj-statline{border-top:1px solid #a88458;padding-top:8px}
#cj.cj-duel-ui{background:linear-gradient(180deg,rgba(21,11,9,.76),transparent 28%,transparent 65%,rgba(21,11,9,.9));padding:14px 18px 18px;overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto auto;pointer-events:none;font-family:system-ui,sans-serif}.cj-duel-ui button{pointer-events:auto}.cj-duel-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:20px}.cj-duel-top>div:first-child{display:flex;flex-direction:column}.cj-duel-top b{font:clamp(18px,3vw,32px) Impact,sans-serif;letter-spacing:.04em}.cj-timer{text-align:center;width:82px;height:82px;border:3px solid #d2a960;background:#2c1812;border-radius:50%;display:grid;place-content:center;box-shadow:0 5px 20px #0008}.cj-timer strong{font:34px/1 Impact,sans-serif;color:#fff0bd}.cj-timer small{font-size:9px;text-transform:uppercase;letter-spacing:.08em}.cj-timer.urgent{border-color:#f05d3d;animation:cj-pulse .7s infinite alternate}.cj-top-actions{display:flex;justify-content:flex-end;gap:7px}.cj-scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:30%;margin-top:-35px}.cj-score:nth-child(2){text-align:right}.cj-score>b{display:block;font:25px Impact,sans-serif}.cj-score>span{font-size:11px;color:#d7ba80}.cj-score>div{display:flex;gap:4px;margin-top:6px;min-height:31px}.cj-score:nth-child(2)>div{justify-content:flex-end}.cj-score i{position:relative;min-width:30px;height:25px;padding:3px;background:#ead9ac;color:#25150f;border:2px solid #6b3a22;font:15px Impact,sans-serif;font-style:normal}.cj-score i:after,.cj-color i{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}.cj-score i.red,.color-red .cj-color{color:#b33636}.cj-score i.blue,.color-blue .cj-color{color:#286aa5}.cj-score i.yellow,.color-yellow .cj-color{color:#aa8418}.cj-score i.green,.color-green .cj-color{color:#34824b}.cj-score i.orange,.color-orange .cj-color{color:#c25f25}.cj-score i.purple,.color-purple .cj-color{color:#80518f}.cj-score em{display:none}.cj-center{display:grid;place-items:center;align-content:center}.cj-seal{text-align:center;text-shadow:0 4px 20px #000}.cj-seal span{display:block;font:clamp(50px,9vw,108px) serif;color:#e4bd74;opacity:.55}.cj-seal b{font:clamp(20px,3vw,34px) Impact,sans-serif;letter-spacing:.05em}.cj-rules-active{display:flex;gap:6px;justify-content:center;margin-top:9px}.cj-rules-active span{padding:5px 9px;background:#261610cc;border:1px solid #a66d3e;color:#f4dbad;font-size:11px}.cj-reveal{display:flex;align-items:center;gap:20px}.cj-reveal>b{font:32px Impact,sans-serif}.cj-hand{pointer-events:auto;display:flex;justify-content:center;align-items:stretch;gap:clamp(4px,1vw,12px);padding-top:8px}.cj-card{position:relative;width:min(15.5vw,148px);min-height:176px!important;padding:9px!important;background:linear-gradient(150deg,#f4e8c8,#cfb67c)!important;color:#2b1710!important;border:4px double #5a301d!important;box-shadow:0 8px 22px #0007,inset 0 0 0 3px var(--element)!important;text-align:left;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto auto}.cj-card.fire{--element:#c84f2d}.cj-card.water{--element:#347bb7}.cj-card.snow{--element:#9acbd1}.cj-card:disabled{filter:saturate(.65);opacity:.78}.cj-card .cj-key{position:absolute;top:-9px;left:-9px;background:#24140f;color:#f1dba9;border:2px solid #d1a85f;width:23px;height:23px;display:grid;place-items:center;font:14px Impact,sans-serif}.cj-element{font:25px serif}.cj-element small{font:10px system-ui}.cj-card strong{font:54px/.9 Impact,sans-serif;grid-row:1/3;grid-column:2}.cj-color{grid-column:1/3;font-size:11px;font-weight:800}.cj-color i{margin-right:5px}.cj-card>small{grid-column:1/3;border-top:1px solid #8f704b;padding-top:4px;margin-top:4px;color:#573b26;font-size:9px;line-height:1.15}.cj-card[disabled][title*="Alaplap"]{}.cj-empty{display:grid;place-items:center;font-weight:900}.cj-pass{align-self:center;min-height:70px}.cj-pass small{display:block;font-size:9px;font-weight:400}.cj-spectator-note{text-align:center;padding:8px;color:#d7c29d;font-size:12px}.cj-result-actions{pointer-events:auto;display:flex;justify-content:center;gap:8px;margin-top:8px}.cj-result-actions button:first-child{background:#985426!important}.cj-reveal .cj-card{width:130px}.cj-reveal .cj-card .cj-key{display:none}
.cj-score em{display:block;font:7px/1 system-ui;font-style:normal;text-transform:uppercase}
#cj-menu{z-index:18}.cj-result-actions+.cj-menu{}.mbox .danger{background:#722b25!important}.cj-bots button:focus-visible,.cj-card:focus-visible{outline-color:#8ed8ff!important}
@keyframes cj-pulse{to{transform:scale(1.06);box-shadow:0 0 24px #e44b32}}
@media(max-width:760px){#cj.cj-lobby{inset:auto 8px 8px;width:calc(100vw - 16px);max-height:82vh}.cj-mats{grid-template-columns:1fr}.cj-mats article{min-height:90px}.cj-bots{grid-template-columns:1fr}.cj-duel-top{grid-template-columns:1fr auto}.cj-top-actions{grid-column:1/3}.cj-scoreboard{margin-top:3px;gap:20px}.cj-card{width:18vw;min-height:130px!important;padding:5px!important}.cj-card strong{font-size:36px}.cj-card .cj-element{font-size:17px}.cj-card>small{display:none}.cj-pass{padding:5px!important}.cj-reveal .cj-card{width:100px}.cj-center{min-height:130px}}
body.cj-inside .hud,body.cj-inside #reticle{display:none!important}
.cj-room-help{font-size:11px;line-height:1.6;color:#624226;margin:10px 0 0}
#cj.cj-duel-ui{height:100dvh}.cj-center{position:relative;align-content:start;padding-top:8px;min-height:70px}.cj-seal{display:none}
.cj-reveal{display:flex;justify-content:center;align-items:center;gap:18px}.cj-reveal>b{font:24px Impact,sans-serif}
#cj .cj-reveal .cj-card{width:105px;min-height:125px!important;padding:7px!important}.cj-reveal .cj-card strong{font-size:36px}
.cj-card .cj-art{grid-column:1/3;justify-self:center;align-self:center;width:54px;height:54px;object-fit:contain;opacity:.8;filter:drop-shadow(0 3px 2px #6e482744)}
.cj-reveal .cj-art{width:30px;height:30px}.cj-rules-active{flex-wrap:wrap}.cj-score>div{flex-wrap:wrap}.cj-top-actions>button{white-space:nowrap}
@media(max-height:650px){#cj .cj-hand .cj-card{min-height:142px!important}.cj-hand .cj-art{width:40px;height:40px}.cj-hand .cj-card strong{font-size:42px}.cj-timer{width:65px;height:65px}.cj-timer strong{font-size:28px}}
.cj-scoreboard{margin-top:6px}.cj-duel-top>div:first-child{max-width:40vw}.cj-duel-top b{font-size:clamp(18px,2.6vw,29px)}#cj .cj-card:disabled{opacity:.9;filter:saturate(.85)}
@media(prefers-reduced-motion:reduce){.cj-timer.urgent{animation:none}#cj *,#cj-menu *{transition:none!important}}
#banner{position:fixed;left:0;right:0;top:34%;z-index:6;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;color:#fff}
#banner.on{opacity:1}
#banner b{display:block;font-family:'Pricedown','Impact',sans-serif;font-size:clamp(40px,8vw,88px);letter-spacing:.04em;color:#ffd23e;text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.5)}
#banner span{display:block;font-weight:700;font-size:17px;text-shadow:0 2px 0 #000}
#keys{position:fixed;right:22px;bottom:18px;z-index:3;color:#fff;font-size:12px;line-height:1.6;text-align:right;text-shadow:0 1px 0 #000;opacity:.85}
/* menük (szünet, bolt, lőtér): sötét, nagy betűs lista */
.menu{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(0,0,0,.55)}
.menu[hidden]{display:none}
.mbox{min-width:300px;max-width:calc(100% - 32px);background:rgba(10,10,14,.92);color:#fff;padding:22px;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.mbox h2{margin:0 0 6px;font-family:'Pricedown','Impact',sans-serif;font-size:34px;letter-spacing:.04em;color:#ffd23e}
.mbox button{font:inherit;font-weight:800;font-size:15px;text-align:left;padding:11px 14px;border-radius:4px;border:0;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.mbox button:hover,.mbox button:focus-visible{background:#ffd23e;color:#111;outline:none}
.mbox button:disabled{opacity:.4;cursor:default}
.mbox small{color:#bbb}
</style>
</head>
<body>
<div id="sync"><div><b>SZINKRONIZÁLÁS</b><span id="syncNick"></span><i></i><span id="syncPct">0%</span></div></div>
<div id="flash"></div>
<div id="hurt"></div>
<div class="hud">
  <div id="tr"><div id="weapon"></div><div id="money">$00000000</div><div id="stars"></div></div>
  <div id="bl"><canvas id="radar" width="420" height="300"></canvas><div class="bars"><div><div id="hpbar"></div></div><div><div id="arbar"></div></div></div></div>
  <div id="keys">WASD mozgás · Shift futás · Szóköz ugrás · E használ / beszáll · Jobb egér célzás · Bal egér lövés · 1-4 fegyver · R töltés · Esc szünet</div>
</div>
<div id="reticle" hidden></div>
<div id="prompt" hidden></div>
<div id="toast"></div>
<div id="banner"></div>
<div class="menu" id="pause" hidden><div class="mbox"><h2>Szünet</h2><button type="button" id="resume">▶ Folytatás</button><button type="button" id="quit">← Vissza a mentoring szobába</button><small>Loop City · pilot · 3D elemek: Kenney (CC0), a mosómedve: Tripo AI</small></div></div>
<div class="menu" id="menu" hidden><div class="mbox" id="menubox"></div></div>
<script type="module" src="/game/main.js"></script>
</body>
</html>
